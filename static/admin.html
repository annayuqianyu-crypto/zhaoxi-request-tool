<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朝曦需求工作台 · 管理员看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
:root{--navy:#1a365d;--blue:#2b6cb0;--green:#38a169;--red:#e53e3e;--border:#e2e8f0;--card:#fff}

/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0a1628,#1a365d)}
.login-box{background:white;border-radius:16px;padding:36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:6px}
.login-logo span{color:#48bb78}
.login-sub{font-size:13px;color:#718096;margin-bottom:24px}
.login-box input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:12px;outline:none;font-family:inherit}
.login-box input:focus{border-color:var(--blue)}
.login-btn{width:100%;background:var(--navy);color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
.login-btn:hover{background:var(--blue)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;text-align:center}

/* Layout */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--navy);color:white;padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:16px}
.hdr-logo{font-size:16px;font-weight:800}
.hdr-logo span{color:#48bb78}
.hdr-badge{font-size:11px;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:10px;color:#90cdf4}
.hdr-user{font-size:13px;color:#90cdf4}
.hdr-logout{font-size:12px;color:#90cdf4;cursor:pointer;text-decoration:underline}

.main-wrap{display:flex;flex:1;gap:0}

/* Sidebar */
.sidebar{width:240px;background:white;border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
.sidebar-title{font-size:10px;font-weight:700;color:#a0aec0;letter-spacing:.8px;padding:0 16px 8px;text-transform:uppercase}
.sidebar-item{padding:9px 16px;font-size:13px;color:#4a5568;cursor:pointer;display:flex;align-items:center;gap:8px;border-left:3px solid transparent;transition:all .15s}
.sidebar-item:hover{background:#f7fafc;color:var(--navy)}
.sidebar-item.active{background:#ebf8ff;color:var(--blue);border-left-color:var(--blue);font-weight:600}
.sidebar-item .icon{font-size:15px}

/* Content */
.content{flex:1;padding:24px;overflow-y:auto}
.page{display:none}
.page.active{display:block}

/* Stats cards */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border)}
.stat-num{font-size:32px;font-weight:800;color:var(--navy);margin-bottom:4px}
.stat-label{font-size:13px;color:#718096}

/* Table */
.section-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:14px}
.table-wrap{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:#f7fafc;font-size:11px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;text-align:left;border-bottom:1px solid var(--border)}
tbody td{padding:12px 16px;font-size:13px;color:#2d3748;border-bottom:1px solid #f7fafc;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f7fafc}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.badge-green{background:#c6f6d5;color:#276749}
.badge-blue{background:#bee3f8;color:#2c5282}
.badge-gray{background:#edf2f7;color:#718096}
.btn-sm{padding:4px 12px;font-size:12px;border:none;border-radius:6px;cursor:pointer;font-weight:500}
.btn-primary{background:var(--blue);color:white}
.btn-primary:hover{background:var(--navy)}
.btn-ghost{background:#edf2f7;color:#4a5568}
.btn-ghost:hover{background:#e2e8f0}

/* Detail panel */
.detail-panel{background:white;border-radius:12px;border:1px solid var(--border);padding:20px;margin-top:20px}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.detail-back{font-size:13px;color:var(--blue);cursor:pointer;display:flex;align-items:center;gap:4px}
.convo-wrap{display:flex;flex-direction:column;gap:10px;max-height:500px;overflow-y:auto;padding:4px}
.msg-ai,.msg-user{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6;max-width:85%}
.msg-ai{background:#f7fafc;border:1px solid var(--border);align-self:flex-start}
.msg-user{background:var(--navy);color:white;align-self:flex-end}
.msg-role{font-size:10px;font-weight:700;color:#a0aec0;margin-bottom:3px}
.req-item{background:#f7fafc;border-left:3px solid var(--blue);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:13px}

.empty-tip{text-align:center;padding:40px;color:#a0aec0;font-size:13px}
.loading{text-align:center;padding:20px;color:#a0aec0;font-size:13px}

/* Progress bar */
.prog-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.prog-fill{height:100%;background:var(--green);border-radius:3px}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">需求<span>打磨</span>工作台</div>
    <div class="login-sub">管理员看板 — 请用管理员邮箱登录</div>
    <input id="l-name" type="text" placeholder="您的姓名" />
    <input id="l-email" type="email" placeholder="管理员邮箱" />
    <button class="login-btn" onclick="doLogin()">进入管理后台</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="hdr-left">
      <div class="hdr-logo">需求<span>打磨</span>工作台</div>
      <div class="hdr-badge">管理员看板</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="hdr-user" id="hdr-user"></span>
      <span class="hdr-logout" onclick="logout()">退出</span>
    </div>
  </header>

  <div class="main-wrap">
    <div class="sidebar">
      <div class="sidebar-title">功能导航</div>
      <div class="sidebar-item active" onclick="showPage('overview',this)"><span class="icon">📊</span>数据总览</div>
      <div class="sidebar-item" onclick="showPage('users',this)"><span class="icon">👥</span>用户管理</div>
      <div class="sidebar-item" onclick="showPage('sessions',this)"><span class="icon">📋</span>会话记录</div>
    </div>

    <div class="content">

      <!-- 总览 -->
      <div class="page active" id="page-overview">
        <div class="stats-row" id="stats-row">
          <div class="stat-card"><div class="stat-num" id="stat-users">-</div><div class="stat-label">注册用户数</div></div>
          <div class="stat-card"><div class="stat-num" id="stat-sessions">-</div><div class="stat-label">历史会话数</div></div>
          <div class="stat-card"><div class="stat-num" id="stat-active">-</div><div class="stat-label">近7天活跃用户</div></div>
        </div>
        <div class="section-title">最近活跃用户</div>
        <div class="table-wrap" id="overview-table"><div class="loading">加载中…</div></div>
      </div>

      <!-- 用户管理 -->
      <div class="page" id="page-users">
        <div class="section-title">全部用户</div>
        <div class="table-wrap" id="users-table"><div class="loading">加载中…</div></div>
        <div id="user-detail" style="display:none"></div>
      </div>

      <!-- 会话记录 -->
      <div class="page" id="page-sessions">
        <div class="section-title">全部会话记录</div>
        <div class="table-wrap" id="sessions-table"><div class="loading">加载中…</div></div>
        <div id="session-detail" style="display:none"></div>
      </div>

    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('admin_token') || '';
let currentUser = null;

// ── 工具函数 ──
function fmt(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function progBar(pct) {
  return `<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div> <span style="font-size:11px;color:#718096">${pct}%</span>`;
}

async function api(path, opts={}) {
  const r = await fetch(path, {
    headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers||{}) },
    ...opts
  });
  if (r.status === 401 || r.status === 403) { logout(); throw new Error('权限不足'); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── 登录 ──
async function doLogin() {
  const name  = document.getElementById('l-name').value.trim();
  const email = document.getElementById('l-email').value.trim();
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if (!name || !email) { errEl.textContent = '请填写姓名和邮箱'; return; }
  try {
    const data = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, email})
    }).then(r=>r.json());
    if (!data.is_admin) { errEl.textContent = '该邮箱无管理员权限，请联系系统管理员'; return; }
    token = data.token;
    currentUser = data;
    localStorage.setItem('admin_token', token);
    initApp();
  } catch(e) { errEl.textContent = '登录失败：' + e.message; }
}

async function checkAutoLogin() {
  if (!token) return;
  try {
    const me = await api('/api/auth/me');
    if (!me.is_admin) { logout(); return; }
    currentUser = me;
    initApp();
  } catch(e) { localStorage.removeItem('admin_token'); token = ''; }
}

function logout() {
  localStorage.removeItem('admin_token');
  token = '';
  location.reload();
}

function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('hdr-user').textContent = currentUser.name;
  loadOverview();
}

// ── 页面切换 ──
function showPage(name, el) {
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
  if (name==='users') loadUsers();
  if (name==='sessions') loadAllSessions();
}

// ── 总览 ──
async function loadOverview() {
  try {
    const stats = await api('/api/admin/stats');
    document.getElementById('stat-users').textContent = stats.total_users;
    document.getElementById('stat-sessions').textContent = stats.total_sessions;
    document.getElementById('stat-active').textContent = stats.active_7d;

    const {users} = await api('/api/admin/users');
    const recent = users.slice(0, 8);
    document.getElementById('overview-table').innerHTML = renderUsersTable(recent, true);
  } catch(e) { console.error(e); }
}

// ── 用户列表 ──
async function loadUsers() {
  document.getElementById('users-table').innerHTML = '<div class="loading">加载中…</div>';
  document.getElementById('user-detail').style.display = 'none';
  try {
    const {users} = await api('/api/admin/users');
    document.getElementById('users-table').innerHTML = renderUsersTable(users, false);
  } catch(e) { document.getElementById('users-table').innerHTML = '<div class="empty-tip">加载失败</div>'; }
}

function renderUsersTable(users, compact) {
  if (!users.length) return '<div class="empty-tip">暂无用户数据</div>';
  return `<table>
    <thead><tr>
      <th>姓名</th><th>邮箱</th><th>会话数</th><th>最高完整度</th>
      <th>最近活跃</th>${!compact?'<th>操作</th>':''}
    </tr></thead>
    <tbody>${users.map(u=>`<tr>
      <td><strong>${esc(u.name)}</strong></td>
      <td style="color:#718096">${esc(u.email)}</td>
      <td><span class="badge badge-blue">${u.session_count||0} 条</span></td>
      <td>${progBar(u.max_completeness||0)}</td>
      <td style="font-size:12px;color:#718096">${fmt(u.last_active)}</td>
      ${!compact?`<td><button class="btn-sm btn-primary" onclick="viewUser('${u.id}','${esc(u.name)}')">查看记录</button></td>`:''}
    </tr>`).join('')}
    </tbody></table>`;
}

async function viewUser(userId, name) {
  const detailEl = document.getElementById('user-detail');
  detailEl.style.display = 'block';
  detailEl.innerHTML = `<div class="detail-panel">
    <div class="detail-header">
      <div style="font-size:15px;font-weight:700;color:var(--navy)">👤 ${esc(name)} 的会话记录</div>
      <button class="btn-sm btn-ghost" onclick="document.getElementById('user-detail').style.display='none'">关闭</button>
    </div>
    <div class="loading">加载中…</div>
  </div>`;
  try {
    const {sessions} = await api(`/api/admin/users/${userId}/sessions`);
    detailEl.innerHTML = `<div class="detail-panel">
      <div class="detail-header">
        <div style="font-size:15px;font-weight:700;color:var(--navy)">👤 ${esc(name)} 的会话记录（${sessions.length} 条）</div>
        <button class="btn-sm btn-ghost" onclick="document.getElementById('user-detail').style.display='none'">关闭</button>
      </div>
      ${renderSessionsList(sessions, 'user-session-detail')}
    </div>`;
  } catch(e) { detailEl.innerHTML = '<div class="empty-tip">加载失败</div>'; }
}

// ── 全部会话 ──
async function loadAllSessions() {
  document.getElementById('sessions-table').innerHTML = '<div class="loading">加载中…</div>';
  document.getElementById('session-detail').style.display = 'none';
  try {
    const {users} = await api('/api/admin/users');
    // 聚合所有用户的会话（从用户列表获取，再按需展开）
    let rows = '';
    for (const u of users) {
      const {sessions} = await api(`/api/admin/users/${u.id}/sessions`);
      rows += sessions.map(s=>`<tr>
        <td><strong>${esc(s.title||'未命名会话')}</strong></td>
        <td>${esc(u.name)}</td>
        <td>${progBar(s.completeness||0)}</td>
        <td style="font-size:12px;color:#718096">${fmt(s.created_at)}</td>
        <td style="font-size:12px;color:#718096">${fmt(s.updated_at)}</td>
        <td><button class="btn-sm btn-primary" onclick="viewSession('${s.id}')">查看详情</button></td>
      </tr>`).join('');
    }
    document.getElementById('sessions-table').innerHTML = rows
      ? `<table><thead><tr><th>会话标题</th><th>用户</th><th>需求完整度</th><th>创建时间</th><th>最后更新</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty-tip">暂无会话记录</div>';
  } catch(e) { document.getElementById('sessions-table').innerHTML = '<div class="empty-tip">加载失败</div>'; }
}

function renderSessionsList(sessions, detailId) {
  if (!sessions.length) return '<div class="empty-tip">暂无会话</div>';
  return `<table><thead><tr><th>标题</th><th>完整度</th><th>创建</th><th>最后更新</th><th>操作</th></tr></thead>
    <tbody>${sessions.map(s=>`<tr>
      <td><strong>${esc(s.title||'未命名')}</strong></td>
      <td>${progBar(s.completeness||0)}</td>
      <td style="font-size:12px;color:#718096">${fmt(s.created_at)}</td>
      <td style="font-size:12px;color:#718096">${fmt(s.updated_at)}</td>
      <td><button class="btn-sm btn-primary" onclick="viewSession('${s.id}')">查看</button></td>
    </tr>`).join('')}</tbody></table>`;
}

async function viewSession(sessionId) {
  // 通用：在当前页面显示 session 详情
  const targetId = document.getElementById('user-detail').style.display !== 'none'
    ? 'user-session-detail' : 'session-detail';
  const detailEl = document.getElementById('session-detail');
  detailEl.style.display = 'block';
  detailEl.innerHTML = '<div class="detail-panel"><div class="loading">加载会话内容…</div></div>';
  try {
    const s = await api(`/api/admin/sessions/${sessionId}`);
    detailEl.innerHTML = `<div class="detail-panel">
      <div class="detail-header">
        <span class="detail-back" onclick="detailEl.style.display='none'">← 返回列表</span>
        <div style="font-size:14px;font-weight:700;color:var(--navy)">${esc(s.title||'未命名')} · 完整度 ${s.completeness}%</div>
        <button class="btn-sm btn-ghost" onclick="document.getElementById('session-detail').style.display='none'">关闭</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div style="font-size:13px;font-weight:700;color:#4a5568;margin-bottom:8px">💬 访谈对话（${s.history.length} 条）</div>
          <div class="convo-wrap">
            ${s.history.map(m=>`
              <div>
                <div class="msg-role">${m.role==='user'?'👤 用户':'🤖 AI分析师'}</div>
                <div class="${m.role==='user'?'msg-user':'msg-ai'}">${esc(m.content.slice(0,400))}${m.content.length>400?'…':''}</div>
              </div>`).join('')}
          </div>
        </div>
        <div>
          <div style="font-size:13px;font-weight:700;color:#4a5568;margin-bottom:8px">📋 需求清单（${s.requirements.length} 项）</div>
          <div style="max-height:500px;overflow-y:auto">
            ${s.requirements.length
              ? s.requirements.map(r=>`<div class="req-item">${esc(typeof r==='string'?r:(r.feature||'')+(r.description?'：'+r.description:''))}</div>`).join('')
              : '<div class="empty-tip" style="padding:16px">暂无结构化需求</div>'}
          </div>
        </div>
      </div>
    </div>`;
  } catch(e) { detailEl.innerHTML = '<div class="empty-tip">加载失败</div>'; }
}

// 启动
checkAutoLogin();
</script>
</body>
</html>
